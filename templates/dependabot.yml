# Dependabot version updates: one grouped pull request per ecosystem,
# roughly every two weeks. Copy to .github/dependabot.yml.
#
# Dependabot has no two-week interval, so the schedule is a cron job on
# the 1st and the 15th of each month (times in UTC). The commit-message
# prefixes make every title a valid subject for the commit hook and the
# CI commit check, e.g. "chore(deps): bump the npm group across 1
# directory with 12 updates".
#
# github-actions is always on: workflows pin actions by commit SHA with
# the release tag in a trailing comment (`@<sha> # v7.0.1`), and only
# Dependabot moves them. Uncomment the ecosystems the project uses
# (remove the leading `#` of each `#  ` line).
#
# Security updates are a separate repository setting (Settings, Code
# security, Dependabot security updates); turn them on in every repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)

