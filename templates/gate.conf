# gate.conf: the project's local gate, which the ai-workflow pre-push hook
# (hooks/pre-push) runs before a push to main or the default branch, and
# never before a push to another branch (D128, D142). Copy it to the top
# of the repository, set the command, and commit it: the hook reads it as
# committed in the commit pushed, and refuses the push without it.
#
# Lines are "<key> = <value>"; blank lines and lines starting with # are
# ignored.
#
#   command  required: the whole gate, run with bash at the top of the
#            repository: the tests, lint, types and build. A project
#            with feature files adds
#            .ai-workflow/check-features.sh --base origin/main
#   timeout  optional: the deadline, in whole seconds, at most 86400
#            (default 3600). Past it the gate is stopped and the push
#            refused.
#
# The push is refused when the command fails or is not found, so a tool
# that is not installed stops it, and when the working tree is not the
# commit pushed, before the gate or after it: the gate must not write to
# the tree (a check mode, not --fix; its outputs ignored in a committed
# .gitignore). Its input is /dev/null and GIT_PAGER and PAGER are cat,
# but a step that opens the terminal itself (/dev/tty), such as an ssh
# passphrase prompt, still waits until the deadline: nothing in it may
# prompt. Whoever pushes, an agent included, gives the push command a
# deadline longer than this timeout.

command = make test lint
timeout = 3600
