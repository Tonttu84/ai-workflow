name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history, so the decision log check finds origin/main
          fetch-depth: 0
      # Ubuntu's own Python is externally managed (PEP 668): pip cannot
      # install into it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest tests -q
      - name: Decision log
        run: python scripts/decisions.py check --base origin/main
      - name: Shell tests
        run: ./tests/run.sh
      - name: ShellCheck
        run: |
          shellcheck --version
          make lint
